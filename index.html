const I18N={ru:{overview:'Обзор',lab:'Лаборатория',stats:'Статистика',profile:'Профиль',about:'О модели',new:'Новый эксперимент',viewLab:'Открыть лабораторию',tagline:'УЧЕБНЫЙ СИМУЛЯТОР ПОЖАРА НА БОРТУ',heroTitle:'Огонь в космосе — изучайте безопасно',heroText:'Интерактивная учебная лаборатория для изучения того, как атмосфера, вентиляция, материал и гравитация могут менять развитие условного пожара в герметичном отсеке.',runs:'ЗАПУСКОВ',params:'ПАРАМЕТРОВ',saved:'СОХРАНЕНО',last:'Последний запуск',recent:'Сохранённые эксперименты',noRuns:'История пока пуста. Настройте условия и проведите первый запуск.',startFirst:'Начать первый эксперимент',feature1:'Визуальная модель',feature1d:'Концептуальная анимация отсека и пламени, не CFD.',feature2:'Живые показатели',feature2d:'Следите за условными температурой, кислородом и дымом.',feature3:'Сравнение сценариев',feature3d:'Сохраняйте результаты и изучайте различия настроек.',labTitle:'Лаборатория',labDesc:'Задайте условия отсека и наблюдайте, как они влияют на условную модель горения.',scenario:'Готовый сценарий',basic:'Базовый',oxygenHigh:'Повышенный кислород',airHigh:'Усиленный поток',cool:'Прохладный отсек',pressure:'Общее давление',oxygen:'Кислород',temp:'Начальная температура',airflow:'Воздушный поток',duration:'Длительность',gravity:'Режим гравитации',earth:'Земная',micro:'Микрогравитация',moon:'Лунная',material:'Условный материал',polymer:'Полимер',cotton:'Ткань',wood:'Дерево',metal:'Композит',suppression:'Пожаротушение',suppressionOn:'Система активна',suppressionOff:'Система выключена',fixedPressure:'Давление фиксируется на время запуска',simulationView:'ВИЗУАЛЬНАЯ МОДЕЛЬ · НЕ 3D ФИЗИЧЕСКИЙ РАСЧЁТ',start:'Запустить',pause:'Пауза',resume:'Продолжить',reset:'Сбросить',save:'Сохранить эксперимент',export:'Экспорт отчёта',statusReady:'ГОТОВ',statusRun:'ИДЁТ',statusPause:'ПАУЗА',statusDone:'ЗАВЕРШЁН',elapsed:'ВРЕМЯ',metrics:'Показатели в реальном времени',temperature:'Температура',oxygenPP:'Парциальное давление O₂',fire:'Индекс огня',smoke:'Дым',chart:'Ход показателей',seriesTemp:'Температура',seriesOxy:'O₂',seriesFire:'Индекс огня',seriesSmoke:'Дым',statsTitle:'Статистика экспериментов',statsDesc:'История запусков, итоговые показатели и сравнение двух сохранённых сценариев.',history:'История запусков',selectRun:'Выберите запуск в истории',noHistory:'Нет сохранённых запусков. Проведите симуляцию и сохраните её, чтобы начать сравнение.',summary:'Сводка',avgTemp:'Пиковая температура',peakTemp:'Пиковая температура',finalOxy:'Конечный O₂',peakFire:'Пик индекса огня',peakSmoke:'Пик дыма',details:'Детали запуска',compare:'Сравнить два запуска',chooseCompare:'Выберите второй запуск',settingsDiff:'Различия настроек',outcomeDiff:'Изменения показателей',profileTitle:'Профиль',demoUser:'Исследователь ORBITAL LAB',demoDesc:'Демонстрационный профиль · данные хранятся только в этом браузере',preferences:'Предпочтения',language:'Язык интерфейса',theme:'Тема оформления',dark:'Тёмная',light:'Светлая',data:'Управление данными',exportJSON:'Скачать все эксперименты (JSON)',exportCSV:'Скачать эксперименты (CSV)',clear:'Удалить историю',clearConfirm:'Удалить все сохранённые эксперименты в этом браузере?',aboutTitle:'О модели',aboutDesc:'Что показывают числа и какие упрощения использует эта учебная демо-версия.',disclaimer:'Это образовательная демонстрация. Она не является инженерным инструментом, CFD, прогнозом безопасности или рекомендацией по тушению пожара.',about1:'Парциальное давление кислорода',about1d:'Рассчитывается как общее давление × доля O₂. Например, 101 кПа × 21% ≈ 21,2 кПа. В каждом запуске общее давление фиксировано; состав газа меняется по простой модели расхода и вентиляции.',about2:'Условный индекс огня',about2d:'Безразмерный индекс от 0 до 100 для сравнения сценариев. Он не является вероятностью спасения экипажа или измерением реального риска.',about3:'Детерминированная учебная модель',about3d:'Шаговая формула связывает O₂, температуру, материал и вентиляцию с условным горением, наг y',clearConfirm:'Delete all saved experiments in this browser?',aboutTitle:'About the model',aboutDesc:'What the values represent and which simplifications this educational demo uses.',disclaimer:'This is an educational demonstration. It is not an engineering tool, CFD, safety forecast, or fire suppression recommendation.',about1:'Oxygen partial pressure',about1d:'Computed as total pressure × O₂ fraction. For example, 101 kPa × 21% ≈ 21.2 kPa. Total pressure is fixed during each run; gas composition changes through a simple depletion and ventilation model.',about2:'Illustrative fire index',about2d:'A dimensionless index from 0 to 100 for comparing scenarios. It is not a crew survival probability or a real risk measurement.',about3:'Deterministic learning model',about3d:'A step formula links O₂, temperature, material, and airflow to modeled burning, heating, smoke, and flame. Identical settings produce repeatable runs.',about4:'Airflow',about4d:'The model includes oxygen delivery, heat removal, and smoke removal at the same time. The overall flame change therefore depends on oxygen conditions and current heating.',about5:'Gravity and suppression',about5d:'Gravity mode changes only flame appearance and modeled heat transfer. Suppression progressively lowers burning and then reduces heating.',about6:'Limitations',about6d:'Illustrative coefficients are not calibrated against experiments. The model omits cabin geometry, chemistry, real sensors, and crew dynamics. Values are for educational comparison only.',footer:'EDUCATIONAL DEMO · NOT FOR ENGINEERING DECISIONS',savedMsg:'Experiment saved',resetMsg:'Current run reset',runningMsg:'Pause the run or wait for it to finish first',nothingMsg:'No data to save',deletedMsg:'History deleted',loadedMsg:'Run opened in laboratory',remove:'Delete',open:'Open in laboratory',compareLabel:'Compare',none:'—',contrast:'High contrast'}};
const defaults={pressure:101,oxygen:21,temp:24,airflow:35,duration:120,gravity:'micro',material:'polymer',suppression:false};const presets={basic:{...defaults},oxygenHigh:{...defaults,oxygen:28,temp:28},airHigh:{...defaults,airflow:75},cool:{...defaults,temp:16,pressure:80}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,d)=>{try{let v=localStorage.getItem('orbital-'+k);return v===null?d:JSON.parse(v)}catch{return d}};
let state={page:'overview',lang:get('lang','ru'),theme:get('theme','dark'),history:get('history',[]),selected:null,compare:null,settings:{...defaults,...get('settings',{})},status:'ready',elapsed:0,series:[],sim:null};

function persist(){localStorage.setItem('orbital-lang',JSON.stringify(state.lang));localStorage.setItem('orbital-theme',JSON.stringify(state.theme));localStorage.setItem('orbital-history',JSON.stringify(state.history));localStorage.setItem('orbital-settings',JSON.stringify(state.settings))}
function navBtn(key,icon){return `<button data-page="${key}" class="${state.page===key?'active':''}" aria-label="${t(key)}"><b>${icon}</b><span>${t(key)}</span></button>`}
function shell(content){document.body.classList.toggle('light',state.theme==='light');document.documentElement.lang=state.lang;$('#app').innerHTML=`<header class="topbar"><div class="brand"><span class="brandmark">◉</span> ORBITAL LAB</div><nav class="nav">${navBtn('overview','⌂')}${navBtn('lab','⊙')}${navBtn('stats','▥')}${navBtn('profile','◌')}${navBtn('about','ⓘ')}</nav><div class="toolbar"><button class="lang ${state.lang==='ru'?'chosen':''}" data-lang="ru">RU</button><button class="lang ${state.lang==='en'?'chosen':''}" data-lang="en">EN</button><button class="iconbtn" data-theme aria-label="${t('theme')}">${state.theme==='dark'?'☼':'☾'}</button></div></header><main class="container">${content}<footer class="footer"><span>ORBITAL LAB / ${t('footer')}</span><span class="mono">SIMULATION BUILD 01.04 · LOCAL DATA</span></footer></main><nav class="mobile-nav">${navBtn('overview','⌂')}${navBtn('lab','⊙')}${navBtn('stats','▥')}${navBtn('profile','◌')}${navBtn('about','ⓘ')}</nav>`;wire()}
function overview(){let newest=state.history[0];return `<section class="grid overview-grid"><article class="panel hero"><div class="hero-art"><div class="orbit"></div><div class="orbit two"></div><div class="planet"></div><div class="ship"><div class="wing"></div><div class="shipbody"></div><div class="fire-window"></div></div></div><div class="hero-copy"><div class="eyebrow">${t('tagline')}</div><h1 class="title metal">${t('heroTitle')}</h1><p>${t('heroText')}</p><div class="hero-stats"><div class="hero-stat"><strong>${state.history.length.toString().padStart(2,'0')}</strong><span>${t('runs')}</span></div><div class="hero-stat"><strong>08</strong><span>${t('params')}</span></div><div class="hero-stat"><strong>${state.history.length.toString().padStart(2,'0')}</strong><span>${t('saved')}</span></div></div><button class="btn primary" data-page="lab">${t('new')} <span aria-hidden="true">↗</span></button></div></article><div class="stack"><article class="panel panel-pad quick-card"><div class="eyebrow">${t('last')}</div>${newest?`<div class="exp-card"><div><strong>${esc(newest.name)}</strong><div class="small muted">${new Date(newest.date).toLocaleString(state.lang==='ru'?'ru-RU':'en-US')}</div></div><span class="badge"><i class="dot"></i>${t('statusDone')}</span></div><button class="btn cyan" data-open="${newest.id}">${t('open')} →</button>`:`<div class="empty"><div class="planet-icon">◌</div>${t('noRuns')}<br><button class="btn cyan" data-page="lab" style="margin-top:12px">${t('startFirst')} →</button></div>`}</article><article class="panel panel-pad quick-card"><div class="eyebrow">${t('recent')}</div>${state.history.length?state.history.slice(0,3).map(run=>`<div class="exp-card"><div><strong>${esc(run.name)}</strong><div class="small muted">${fmt(run.final.temp,0)}°C · ${fmt(run.final.fire,0)} ${t('fire').toLowerCase()}</div></div><button class="btn" data-open="${run.id}" aria-label="${t('open')}">↗</button></div>`).join(''):`<div class="empty">${t('noRuns')}</div>`}</article></div><div class="grid feature-row"><div class="panel feature"><div class="feature-icon">◈</div><div><h3>${t('feature1')}</h3><p>${t('feature1d')}</p></div></div><div class="panel feature"><div class="feature-icon">⌁</div><div><h3>${t('feature2')}</h3><p>${t('feature2d')}</p></div></div><div class="panel feature"><div class="feature-icon">◇</div><div><h3>${t('feature3')}</h3><p>${t('feature3d')}</p></div></div></div></section>`}
function range(id,label,val,min,max,step,unit,help='',locked=false){return `<div class="control"><div class="range-head"><label for="${id}">${label}</label><output id="${id}out">${val}${unit}</output></div><input class="range" type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" ${locked?'disabled':''} aria-label="${label}"><div class="range-hint"><span>${min}${unit}</span><span>${max}${unit}</span></div>${help?`<div class="fieldnote">${help}</div>`:''}</div>`}
function lab(){let s=state.settings,pressure=s.pressure,oxy=s.oxygen,pp=pressure*oxy/100,dur=s.duration,locked=state.status==='running'||state.status==='paused',st=t('status'+(state.status==='running'?'Run':state.status==='paused'?'Pause':state.status==='done'?'Done':'Ready'));return `<div class="pagehead"><div><div class="eyebrow">01 / ${t('lab').toUpperCase()}</div><h1 class="title">${t('labTitle')}</h1><p>${t('labDesc')}</p></div><span class="badge"><i class="dot" style="background:${state.status==='running'?'var(--orange)':'var(--teal)'}"></i>${st}</span></div><section class="grid lab-layout"><aside class="panel controls"><div class="panel-pad" style="padding-bottom:0"><div class="panel-title">${t('scenario')}</div><div class="panel-sub">${t('fixedPressure')}</div></div><div class="control-section"><select id="preset" class="select" ${locked?'disabled':''} aria-label="${t('scenario')}"><option value="">${t('scenario')}…</option><option value="basic">${t('basic')}</option><option value="oxygenHigh">${t('oxygenHigh')}</option><option value="airHigh">${t('airHigh')}</option><option value="cool">${t('cool')}</option></select>${range('pressure',t('pressure'),s.pressure,60,120,1,' kPa','',locked)}${range('oxygen',t('oxygen'),s.oxygen,12,35,1,'%','',locked) }<div class="fieldnote">${state.lang==='ru'?'Парциальное O₂ сейчас:':'O₂ partial pressure now:'} <b class="mono" style="color:var(--cyan)">${fmt(pp,1)} kPa</b></div>${range('temp',t('temp'),s.temp,10,60,1,'°C','',locked)}${range('airflow',t('airflow'),s.airflow,0,100,1,'%','',locked)}${range('duration',t('duration'),s.duration,30,300,10,' s','',locked)}<div class="control"><div class="range-head"><label for="gravity">${t('gravity')}</label></div><select class="select" id="gravity" ${locked?'disabled':''}><option value="earth" ${s.gravity==='earth'?'selected':''}>${t('earth')}</option><option value="micro" ${s.gravity==='micro'?'selected':''}>${t('micro')}</option><option value="moon" ${s.gravity==='moon'?'selected':''}>${t('moon')}</option></select></div><div class="control"><div class="range-head"><label for="material">${t('material')}</label></div><select class="select" id="material" ${locked?'disabled':''}><option value="polymer" ${s.material==='polymer'?'selected':''}>${t('polymer')}</option><option value="cotton" ${s.material==='cotton'?'selected':''}>${t('cotton')}</option><option value="wood" ${s.material==='wood'?'selected':''}>${t('wood')}</option><option value="metal" ${s.material==='metal'?'selected':''}>${t('metal')}</option></select></div><div class="control"><div class="switchrow"><span>${t('suppression')}</span><input id="suppression" class="switch" type="checkbox" ${s.suppression?'checked':''} ${locked?'disabled':''} aria-label="${t('suppression')}"></div><div class="fieldnote">${s.suppression?t('suppressionOn'):t('suppressionOff')}</div></div></div></aside><section class="sim-stage"><div class="sim-scene ${s.gravity==='micro'?'gravity-micro':s.gravity==='moon'?'gravity-moon':''} ${state.sim&&state.sim.fire<2?'extinguished':''}" id="scene"><div class="scene-space"></div><div class="scene-stars"></div><div class="cabin"><span class="window-label">ORBITAL LAB / MODULE 01</span><div class="panel-seam left"></div><div class="panel-seam right"></div></div><div class="fire-wrap"><div class="fire-core"></div></div><div class="smoke"></div><div class="smoke s2"></div><div class="smoke s3"></div><div class="sparks" id="sparks"></div><div class="bottom-hud"><span>O₂ ${fmt(state.sim?state.sim.oxygen:oxy,1)}% · ${fmt(state.sim?state.sim.pressure*state.sim.oxygen/100:pp,1)} kPa</span><span class="live-pill">${t('simulationView')}</span><span>${t('elapsed')} ${state.elapsed}s / ${dur}s</span></div></div><div class="sim-controls"><button class="btn primary" data-action="start" ${state.status==='running'||state.status==='paused'?'disabled':''}>▷ ${t('start')}</button><button class="btn" data-action="pause" ${state.status!=='running'?'disabled':''}>Ⅱ ${t('pause')}</button><button class="btn" data-action="resume" ${state.status!=='paused'?'disabled':''}>▷ ${t('resume')}</button><button class="btn" data-action="reset">↺ ${t('reset')}</button><span class="statusline">${st} · ${state.elapsed}s / ${dur}s</span></div><div class="runprogress"><i style="width:${Math.min(100,state.elapsed/dur*100)}%"></i></div><article class="panel panel-pad"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="panel-title">${t('chart')}</div><div class="panel-sub">${t('metrics')}</div></div><button class="btn cyan" data-action="save" ${state.series.length<2?'disabled':''}>＋ ${t('save')}</button></div><div class="chart-wrap"><canvas id="liveChart" aria-label="${t('chart')}"></canvas></div><div class="chart-legend"><span style="--c:#f97316">${t('seriesTemp')}</span><span style="--c:#22d3ee">${t('seriesOxy')}</span><span style="--c:#fde047">${t('seriesFire')}</span><span style="--c:#94a3b8">${t('seriesSmoke')}</span></div></article></section><aside class="grid livecol"><div class="panel panel-pad" style="grid-column:1/-1"><div class="panel-title">${t('metrics')}</div><div class="panel-sub">${t('fixedPressure')}</div></div><article class="panel panel-pad metric"><div class="metric-top">${t('temperature')} <span>◉</span></div><div class="metric-value metric-accent" id="mTemp">${fmt(state.sim?state.sim.temp:s.temp)}<span class="metric-unit"> °C</span></div><div class="metricbar"><i id="bTemp" style="width:${Math.min(100,(state.sim?state.sim.temp:s.temp)/160*100)}%"></i></div></article><article class="panel panel-pad metric"><div class="metric-top">${t('oxygen')} <span>◌</span></div><div class="metric-value" id="mOxy">${fmt(state.sim?state.sim.oxygen:s.oxygen)}<span class="metric-unit"> %</span></div><div class="metric-sub small muted" id="mPP">${fmt((state.sim?state.sim.pressure:s.pressure)*(state.sim?state.sim.oxygen:s.oxygen)/100,1)} kPa</div></article><article class="panel panel-pad metric"><div class="metric-top">${t('fire')} <span>⌁</span></div><div class="metric-value" id="mFire">${fmt(state.sim?state.sim.fire:0,0)}<span class="metric-unit"> / 100</span></div><div class="metricbar"><i id="bFire" style="width:${state.sim?state.sim.fire:0}%"></i></div></article><article class="panel panel-pad metric"><div class="metric-top">${t('smoke')} <span>≈</span></div><div class="metric-value" id="mSmoke">${fmt(state.sim?state.sim.smoke:0,0)}<span class="metric-unit"> / 100</span></div><div class="metricbar"><i id="bSmoke" style="width:${state.sim?state.sim.smoke:0}%"></i></div></article><article class="panel panel-pad" style="grid-column:1/-1"><div class="panel-title">${t('suppression')}</div><div class="panel-sub">${s.suppression?t('suppressionOn'):t('suppressionOff')}</div></article></aside></section>`}
function stats(){let run=state.history.find(x=>x.id===state.selected),other=state.history.find(x=>x.id===state.compare);return `<div class="pagehead"><div><div class="eyebrow">02 / ${t('stats').toUpperCase()}</div><h1 class="title">${t('statsTitle')}</h1><p>${t('statsDesc')}</p></div><button class="btn cyan" data-export="csv">↓ ${t('export')}</button></div><section class="grid stat-layout"><article class="panel"><div class="panel-pad"><div class="panel-title">${t('history')}</div><div class="panel-sub">${state.history.length} / ${state.lang==='ru'?'локальных запусков':'local runs'}</div></div><div class="history-list">${state.history.length?state.history.map(r=>`<div class="history-item ${r.id===state.selected?'selected':''}" data-select="${r.id}"><span class="tag">${fmt(r.final.fire,0)} FI</span><strong>${esc(r.name)}</strong><span>${new Date(r.date).toLocaleString(state.lang==='ru'?'ru-RU':'en-US')} · ${fmt(r.settings.pressure,0)} kPa / ${r.settings.oxygen}% O₂</span></div>`).join(''):`<div class="empty"><div class="planet-icon">◌</div>${t('noHistory')}<br><button class="btn cyan" data-page="lab" style="margin-top:12px">${t('viewLab')} →</button></div>`}</div></article><article class="panel panel-pad stat-detail">${run?`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="eyebrow">${t('details')}</div><h2 class="panel-title" style="font-size:20px;margin:8px 0">${esc(run.name)}</h2><div class="small muted">${new Date(run.date).toLocaleString(state.lang==='ru'?'ru-RU':'en-US')}</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" data-open="${run.id}">${t('open')}</button><button class="btn danger" data-delete="${run.id}">${t('remove')}</button></div></div><div class="grid stat-summary">${statmetric(t('peakTemp'),run.final.temp,'°C')}${statmetric(t('finalOxy'),run.final.oxygen,'%')}${statmetric(t('peakFire'),run.final.fire,'/100')}${statmetric(t('peakSmoke'),run.final.smoke,'/100')}</div><div class="panel-title">${t('settingsDiff')} · ${t('summary')}</div><div class="compare-col" style="margin-top:10px"><div class="compare-row"><span>${t('pressure')}</span><b>${run.settings.pressure} kPa</b></div><div class="compare-row"><span>${t('oxygen')}</span><b>${run.settings.oxygen}% · ${fmt(run.settings.pressure*run.settings.oxygen/100,1)} kPa</b></div><div class="compare-row"><span>${t('temp')}</span><b>${run.settings.temp}°C</b></div><div class="compare-row"><span>${t('airflow')}</span><b>${run.settings.airflow}%</b></div><div class="compare-row"><span>${t('gravity')}</span><b>${t(run.settings.gravity)}</b></div><div class="compare-row"><span>${t('material')}</span><b>${t(run.settings.material)}</b></div><div class="compare-row"><span>${t('suppression')}</span><b>${run.settings.suppression?t('suppressionOn'):t('suppressionOff')}</b></div></div><div class="chart-wrap"><canvas id="statChart"></canvas></div><div class="panel-title" style="margin-top:14px">${t('compare')}</div><select class="select" id="compareSelect" style="margin-top:10px"><option value="">${t('chooseCompare')}…</option>${state.history.filter(x=>x.id!==run.id).map(x=>`<option value="${x.id}" ${state.compare===x.id?'selected':''}>${esc(x.name)} · ${new Date(x.date).toLocaleDateString()}</option>`).join('')}</select>${other?compareMarkup(run,other):state.history.length<2?`<div class="fieldnote">${t('noHistory')}</div>`:''}`:`<div class="empty" style="padding-top:80px">${t('selectRun')}</div>`}</article></section>`}

function compareMarkup(a,b){let keys=['pressure','oxygen','temp','airflow','gravity','material','suppression'];let vals={pressure:x=>x+' kPa',oxygen:x=>x+'%',temp:x=>x+'°C',airflow:x=>x+'%',gravity:x=>t(x),material:x=>t(x),suppression:x=>x?t('suppressionOn'):t('suppressionOff')};return `<div class="compare-box"><div class="compare-col"><h4>${esc(a.name)}</h4>${keys.map(k=>`<div class="compare-row"><span>${t(k)}</span><b>${vals[k](a.settings[k])}</b></div>`).join('')}</div><div class="compare-col"><h4>${esc(b.name)}</h4>${keys.map(k=>`<div class="compare-row"><span>${t(k)}</span><b class="${a.settings[k]!==b.settings[k]?'delta':''}">${vals[k](b.settings[k])}</b></div>`).join('')}</div><div class="compare-col"><h4>${t('outcomeDiff')}</h4>${['temp','oxygen','fire','smoke'].map(k=>{let delta=b.final[k]-a.final[k];return `<div class="compare-row"><span>${t(k==='temp'?'temperature':k==='fire'?'fire':k)}</span><b class="delta">${delta>0?'+':''}${fmt(delta,1)} ${k==='temp'?'°C':'/100'}</b></div>`}).join('')}</div></div>`}

function about(){let items=[['01',t('about1'),t('about1d')],['02',t('about2'),t('about2d')],['03',t('about3'),t('about3d')],['04',t('about4'),t('about4d')],['05',t('about5'),t('about5d')],['06',t('about6'),t('about6d')]];return `<div class="pagehead"><div><div class="eyebrow">04 / ${t('about').toUpperCase()}</div><h1 class="title">${t('aboutTitle')}</h1><p>${t('aboutDesc')}</p></div></div><div class="notice">⚠ ${t('disclaimer')}</div><section class="grid about-grid" style="margin-top:16px">${items.map(([n,h,p])=>`<article class="panel about-item"><div class="num">${n} / ORBITAL LAB</div><h3>${h}</h3><p>${p}</p></article>`).join('')}</section>`}
function render(){let content=state.page==='overview'?overview():state.page==='lab'?lab():state.page==='stats'?stats():state.page==='profile'?profile():about();shell(content);if(state.page==='lab'){setTimeout(()=>{drawChart($('#liveChart'),state.series);updateSparks();},10)}if(state.page==='stats'&&state.selected)setTimeout(()=>drawChart($('#statChart'),state.history.find(x=>x.id===state.selected)?.series||[],'small'),10)}
function showToast(msg){let e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>e.classList.remove('show'),2300)}
function persistSettings(){persist()}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;persist();render()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';persist();render()});document.querySelectorAll('[data-settheme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.settheme;persist();render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportData(b.dataset.export));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRun(b.dataset.open));document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.select;state.compare=null;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.history=state.history.filter(x=>x.id!==b.dataset.delete);if(state.selected===b.dataset.delete)state.selected=state.history[0]?.id||null;persist();render();showToast(t('deletedMsg'))});let compare=$('#compareSelect');if(compare)compare.onchange=()=>{state.compare=compare.value||null;render()};let preset=$('#preset');if(preset)preset.onchange=()=>{if(preset.value){state.settings={...presets[preset.value]};persistSettings();render()}};['pressure','oxygen','temp','airflow','duration'].forEach(id=>{let el=$('#'+id);if(el)el.oninput=()=>{state.settings[id]=Number(el.value);$('#'+id+'out').textContent=el.value+({pressure:' kPa',oxygen:'%',temp:'°C',airflow:'%',duration:' s'}[id]);updateDerived();persistSettings()}});for(let id of ['gravity','material'])if($('#'+id))$('#'+id).onchange=e=>{state.settings[id]=e.target.value;persistSettings();render()};if($('#suppression'))$('#suppression').onchange=e=>{state.settings.suppression=e.target.checked;persistSettings();render()};}
function updateDerived(){let s=state.settings,pp=s.pressure*s.oxygen/100;if($('#scene')){$('#scene').classList.toggle('gravity-micro',s.gravity==='micro');$('#scene').classList.toggle('gravity-moon',s.gravity==='moon');$('#mPP').textContent=fmt(pp,1)+' kPa';if(state.status==='ready'){ $('#mOxy').innerHTML=fmt(s.oxygen,1)+'<span class="metric-unit"> %</span>';$('#mTemp').innerHTML=fmt(s.temp,1)+'<span class="metric-unit"> °C</span>';}}}
function resetState(){clearInterval(state.timer);state.timer=null;state.status='ready';state.elapsed=0;state.series=[];state.sim=null;render();showToast(t('resetMsg'))}
function action(a){if(a==='start'){if(state.status==='running'||state.status==='paused')return;state.elapsed=0;state.series=[];let s=state.settings;state.sim={pressure:s.pressure,oxygen:s.oxygen,temp:s.temp,smoke:0,fire:0};state.status='running';step();state.timer=setInterval(step,500);render()}else if(a==='pause'&&state.status==='running'){clearInterval(state.timer);state.timer=null;state.status='paused';render()}else if(a==='resume'&&state.status==='paused'){state.status='running';state.timer=setInterval(step,500);render()}else if(a==='reset')resetState();else if(a==='save')saveRun();else if(a==='clear'){if(confirm(t('clearConfirm'))){state.history=[];state.selected=null;state.compare=null;persist();render();showToast(t('deletedMsg'))}}}
function step(){let s=state.settings,x=state.sim,dt=.5;let pp=x.pressure*x.oxygen/100;let availability=Math.max(0,Math.min(1,(pp-4)/20));let thermal=Math.max(.28,Math.min(1.5,1+(x.temp-24)*.008));let mat=materialFactor[s.material];let vent=s.airflow/100;let o2Delivery=vent*.035*(s.oxygen/21);let burn=(.09+availability*.48)*thermal*mat*(1+vent*.42);if(s.suppression)burn*=.42;burn=Math.max(0,burn);let heatRelease=burn*materialHeat[s.material]*26;let cooling=.12+vent*.42+(s.gravity==='earth'?.1:s.gravity==='moon'?.045:0);let oxygenLoss=burn*.055;let smokeGain=burn*(s.material==='polymer'?1.05:.82);let smokeRemoval=.09+vent*.5;x.oxygen=Math.max(0,Math.min(40,x.oxygen+(o2Delivery-oxygenLoss)*dt));x.temp=Math.max(-20,Math.min(500,x.temp+(heatRelease-cooling*Math.max(.3,(x.temp-18)/25)-(s.suppression?.55:0))*dt));x.smoke=Math.max(0,Math.min(100,x.smoke+(smokeGain-smokeRemoval*x.smoke/25)*dt));let normalizedO=Math.min(1,x.oxygen/24);x.fire=Math.max(0,Math.min(100,x.fire+(burn*18*normalizedO-(s.suppression?2.5:0)-cooling*.4)*dt));if(x.oxygen<4)x.fire=Math.max(0,x.fire-4*dt);state.elapsed=Math.min(s.duration,state.elapsed+.5);let row={time:state.elapsed,temp:x.temp,oxygen:x.oxygen,fire:x.fire,smoke:x.smoke,pp:x.pressure*x.oxygen/100};state.series.push(row);if(state.elapsed%s.duration===0||state.elapsed>=s.duration){clearInterval(state.timer);state.timer=null;state.status='done'}if(state.page==='lab')updateLive(row);else render()}
function updateLive(x){let f=(q,d=1)=>fmt(q,d);$('#mTemp').innerHTML=f(x.temp)+'<span class="metric-unit"> °C</span>';$('#mOxy').innerHTML=f(x.oxygen)+'<span class="metric-unit"> %</span>';$('#mPP').textContent=f(x.pp,1)+' kPa';$('#mFire').innerHTML=f(x.fire,0)+'<span class="metric-unit"> / 100</span>';$('#mSmoke').innerHTML=f(x.smoke,0)+'<span class="metric-unit"> / 100</span>';$('#bTemp').style.width=Math.min(100,x.temp/160*100)+'%';$('#bFire').style.width=x.fire+'%';$('#bSmoke').style.width=x.smoke+'%';$('.bottom-hud').innerHTML=`<span>O₂ ${f(x.oxygen)}% · ${f(x.pp,1)} kPa</span><span class="live-pill">${t('simulationView')}</span><span>${t('elapsed')} ${state.elapsed}s / ${state.settings.duration}s</span>`;$('.statusline').textContent=t('status'+(state.status==='running'?'Run':state.status==='paused'?'Pause':'Done'))+' · '+state.elapsed+'s / '+state.settings.duration+'s';$('.runprogress i').style.width=state.elapsed/state.settings.duration*100+'%';$('#scene').classList.toggle('extinguished',x.fire<2);drawChart($('#liveChart'),state.series);updateSparks();if(state.status==='done'){document.querySelector('[data-action="pause"]').disabled=true;document.querySelector('[data-action="resume"]').disabled=true;document.querySelector('[data-action="save"]').disabled=false}}
function updateSparks(){let el=$('#sparks');if(!el)return;el.innerHTML='';let strength=state.sim?state.sim.fire:20,count=Math.round(strength/10);for(let i=0;i<count;i++){let s=document.createElement('i');s.className='spark';s.style.left=(45+Math.random()*10)+'%';s.style.top=(45+Math.random()*18)+'%';s.style.setProperty('--dx',(Math.random()*110-55)+'px');s.style.animationDelay=(-Math.random()*2)+'s';el.appendChild(s)}}
function saveRun(){if(state.status==='running'||state.status==='paused'){showToast(t('runningMsg'));return}if(state.series.length<2){showToast(t('nothingMsg'));return}let last=state.series[state.series.length-1],id=crypto.randomUUID?crypto.randomUUID():String(Date.now());let run={id,name:(state.lang==='ru'?'Эксперимент ':'Experiment ')+String(state.history.length+1).padStart(3,'0'),date:new Date().toISOString(),settings:{...state.settings},series:state.series.map(x=>({...x})),final:{temp:Math.max(...state.series.map(x=>x.temp)),oxygen:last.oxygen,fire:Math.max(...state.series.map(x=>x.fire)),smoke:Math.max(...state.series.map(x=>x.smoke))}};state.history.unshift(run);state.selected=id;persist();render();showToast(t('savedMsg'))}
function openRun(id){let r=state.history.find(x=>x.id===id);if(!r)return;state.settings={...r.settings};state.series=r.series.map(x=>({...x}));state.sim={pressure:r.settings.pressure,oxygen:r.final.oxygen,temp:r.series[r.series.length-1].temp,fire:r.series[r.series.length-1].fire,smoke:r.series[r.series.length-1].smoke};state.elapsed=r.series[r.series.length-1].time;state.status='done';state.page='lab';persist();render();showToast(t('loadedMsg'))}
function exportData(type){if(!state.history.length){showToast(t('nothingMsg'));return}let blob,name;if(type==='json'){blob=new Blob([JSON.stringify({app:'ORBITAL LAB',reportTitle:state.lang==='ru'?'Отчёт об учебных экспериментах':'Educational experiment report',language:state.lang,exportedAt:new Date().toISOString(),educationalModel:state.lang==='ru'?'Учебная детерминированная модель, не инженерный прогноз':'Educational deterministic model, not an engineering forecast',fieldLabels:state.lang==='ru'?{pressure:'Общее давление, кПа',oxygen:'Кислород, %',oxygenPartial:'Парциальное давление O₂, кПа',temperature:'Температура, °C',airflow:'Воздушный поток, %',duration:'Длительность, с',fireIndex:'Условный индекс огня, 0–100',smoke:'Условный индекс дыма, 0–100'}:{pressure:'Total pressure, kPa',oxygen:'Oxygen, %',oxygenPartial:'O₂ partial pressure, kPa',temperature:'Temperature, °C',airflow:'Airflow, %',duration:'Duration, s',fireIndex:'Illustrative fire index, 0–100',smoke:'Illustrative smoke index, 0–100'},experiments:state.history.map(r=>({...r,settings:{...r.settings,gravityLabel:t(r.settings.gravity),materialLabel:t(r.settings.material),suppressionLabel:r.settings.suppression?t('suppressionOn'):t('suppressionOff')}}))},null,2)],{type:'application/json'});name='orbital-lab-report.json'}else{let head=state.lang==='ru'?['эксперимент','дата','давление_кПа','кислород_%','парциальное_O2_кПа','начальная_температура_°C','воздушный_поток_%','длительность_с','гравитация','материал','пожаротушение','пиковая_температура_°C','конечный_кислород_%','пиковый_индекс_огня','пиковый_дым']:['experiment','date','pressure_kPa','oxygen_percent','oxygen_partial_kPa','initial_temperature_C','airflow_percent','duration_s','gravity','material','fire_suppression','peak_temperature_C','final_oxygen_percent','peak_fire_index','peak_smoke'];let rows=state.history.map(r=>[r.name,r.date,r.settings.pressure,r.settings.oxygen,fmt(r.settings.pressure*r.settings.oxygen/100,2),r.settings.temp,r.settings.airflow,r.settings.duration,t(r.settings.gravity),t(r.settings.material),r.settings.suppression?(state.lang==='ru'?'включено':'on'):(state.lang==='ru'?'выключено':'off'),r.final.temp,r.final.oxygen,r.final.fire,r.final.smoke]);blob=new Blob([[head,...rows].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});name='orbital-lab-report.csv'}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function drawChart(canvas,series,mode='live'){if(!canvas)return;let rect=canvas.getBoundingClientRect();if(!rect.width)return;let dpr=window.devicePixelRatio||1;canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);let w=rect.width,h=rect.height,pad={l:30,r:8,t:10,b:22};c.clearRect(0,0,w,h);let styles=getComputedStyle(document.body),line=styles.getPropertyValue('--line'),muted=styles.getPropertyValue('--muted');c.strokeStyle=line;c.fillStyle=muted;c.font='9px DM Mono, monospace';for(let i=0;i<4;i++){let y=pad.t+(h-pad.t-pad.b)*i/3;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();c.fillText(String(100-i*30),2,y+3)}if(series.length<2){c.fillStyle=muted;c.textAlign='center';c.font='11px Manrope';c.fillText(state.lang==='ru'?'График появится во время запуска':'Chart appears during a run',w/2,h/2);return}let maxTime=series[series.length-1].time||1;let cols=['#f97316','#22d3ee','#fde047','#94a3b8'];let keys=['temp','oxygen','fire','smoke'];keys.forEach((k,j)=>{c.beginPath();c.strokeStyle=cols[j];c.lineWidth=j===0?1.8:1.4;series.forEach((r,i)=>{let val=k==='temp'?r.temp/2.5:k==='oxygen'?r.oxygen*2.5:r[k];val=Math.max(0,Math.min(100,val));let x=pad.l+(w-pad.l-pad.r)*r.time/maxTime,y=pad.t+(h-pad.t-pad.b)*(1-val/100);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()});c.fillStyle=muted;c.textAlign='left';c.fillText('0s',pad.l,h-5);c.textAlign='right';c.fillText(maxTime+'s',w-pad.r,h-5)}
window.addEventListener('resize',()=>{if(state.page==='lab')drawChart($('#liveChart'),state.series);if(state.page==='stats')drawChart($('#statChart'),state.history.find(x=>x.id===state.selected)?.series||[])});
render();
})();
</script></body></html>
